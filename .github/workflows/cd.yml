name: PulseOps CD

on:
  workflow_run:
    workflows: ["PulseOps CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            echo "=== PulseOps Production Deployment ==="

            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling production image..."
            docker pull ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

            echo "Stopping old container..."
            docker stop pulseops 2>/dev/null || true

            echo "Removing old container..."
            docker rm pulseops 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name pulseops \
              -p 80:8000 \
              ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

            echo "Production deployment completed."